[project]
name = "research-lab"
version = "0.1.0"
description = "Multi-agent research assistant with CrewAI, LangChain, LlamaIndex, Pinecone, and LangSmith"
readme = "README.md"
authors = [
    { name = "vc-tr", email = "vichtovo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai[tools]>=1.14.0",
    "litellm>=1.50.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "llama-index-core>=0.11.0",
    "llama-index-vector-stores-pinecone>=0.2.0",
    "llama-index-readers-file>=0.4.0",
    "pinecone>=5.0.0",
    "langsmith>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "httpx-sse>=0.4.0",
    "pydantic-settings>=2.7.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "duckduckgo-search>=7.0.0",
]

[project.optional-dependencies]
tavily = ["tavily-python>=0.5.0"]
openai = ["langchain-openai>=0.3.0"]
groq = ["langchain-groq>=0.2.0"]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout>=2.3.0",
    "pre-commit>=4.0.0",
    "types-pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "crewai.*",
    "crewai_tools.*",
    "llama_index.*",
    "pinecone.*",
    "langchain_core.*",
    "langchain_anthropic.*",
    "langchain_community.*",
    "langchain_openai.*",
    "duckduckgo_search.*",
    "tavily.*",
    "langsmith.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = [
    "onnxruntime<1.26.0",
]

[project.scripts]
research-lab = "research_lab.cli:main"
