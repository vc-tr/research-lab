name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync
      - run: uv run mypy --strict src/ tests/ evals/

  test:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: "test-key"
      PINECONE_API_KEY: "test-key"
      LANGCHAIN_API_KEY: "test-key"
      LANGCHAIN_TRACING_V2: "false"
      USE_PINECONE: "false"
      IS_TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync
      - run: uv run pytest tests/ -x -v

  smoke-eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: "test-key"
      PINECONE_API_KEY: "test-key"
      LANGCHAIN_API_KEY: "test-key"
      LANGCHAIN_TRACING_V2: "false"
      USE_PINECONE: "false"
      IS_TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync
      - run: uv run pytest tests/test_evals_smoke.py -x --timeout=60
